name: Test JavaScript CLI

# Manual until the JS CLI test chain is repaired: integrations depend on a
# missing @paws/cli package, pnpm-lock.yaml lacks the diff dependency, and the
# mocha suite does not load under ts-node.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm --filter @paws/cli-js test

      - name: Run linter
        run: pnpm --filter @paws/cli-js lint
