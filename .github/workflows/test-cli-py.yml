name: Test Python CLI

# Smoke test on one supported Python. rich is optional for the CLI but the
# interactive-review tests patch its prompts, so it is installed here.
on:
  push:
    branches: [ main ]
    paths:
      - 'packages/cli-py/**'
      - 'packages/core/**'
      - '.github/workflows/test-cli-py.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/cli-py/**'
      - 'packages/core/**'
      - '.github/workflows/test-cli-py.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd packages/cli-py
          pip install -e . rich pytest

      - name: Run tests
        run: |
          cd packages/cli-py
          pytest tests/ -q
